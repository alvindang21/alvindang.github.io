<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Alvin Dang</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F8F7F4;
      --bg-subtle: #F0EEE9;
      --text: #1C1C1C;
      --text-secondary: #6B6B6B;
      --text-tertiary: #9A9A9A;
      --accent: #8B7355;
      --border: #E5E3DE;

      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;

      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
      --space-xl: 8rem;
      --space-2xl: 12rem;
    }

    [data-theme="dark"] {
      --bg: #1A1918;
      --bg-subtle: #242220;
      --text: #F5F4F1;
      --text-secondary: #A8A5A0;
      --text-tertiary: #6B6866;
      --accent: #C4A882;
      --border: #333130;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      position: fixed;
      bottom: var(--space-md);
      left: var(--space-md);
      z-index: 100;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .nav.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .nav-item a {
      color: var(--text-tertiary);
      transition: color 0.3s ease;
      display: inline-block;
    }

    .nav-item a:hover {
      color: var(--text);
    }

    .nav-index {
      color: var(--text-tertiary);
      margin-right: var(--space-xs);
      font-size: 0.65rem;
      opacity: 0.6;
    }

    .top-controls {
      position: fixed;
      top: var(--space-md);
      right: var(--space-md);
      z-index: 100;
      display: flex;
      gap: var(--space-md);
      align-items: center;
    }

    .theme-toggle {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: color 0.3s ease;
      background: none;
      border: none;
    }

    .theme-toggle:hover {
      color: var(--text);
    }

    .theme-icon {
      display: none;
    }

    .theme-icon.dark {
      display: inline;
    }

    [data-theme="dark"] .theme-icon.dark {
      display: none;
    }

    [data-theme="dark"] .theme-icon.light {
      display: inline;
    }

    .info-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: color 0.3s ease;
      background: none;
      border: none;
    }

    .info-btn:hover {
      color: var(--text);
    }

    main {
      min-height: 100vh;
      padding: var(--space-xl) var(--space-md);
      padding-left: calc(var(--space-md) + 100px);
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: var(--space-xl);
    }

    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: var(--space-md);
      animation: revealName 1s ease-out;
    }

    @keyframes revealName {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-xl);
      max-width: 900px;
      animation: fadeUp 1s ease-out 0.3s backwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-tagline {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 300;
      color: var(--text);
      line-height: 1.4;
    }

    .hero-meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-tertiary);
      line-height: 1.8;
      padding-top: 0.3rem;
    }

    .hero-meta span {
      display: block;
    }

    .hero-meta .highlight {
      color: var(--text-secondary);
    }

    .scroll-hint {
      position: absolute;
      bottom: var(--space-lg);
      right: var(--space-md);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      animation: fadeUp 1s ease-out 0.6s backwards;
    }

    .scroll-hint::after {
      content: '';
      display: block;
      width: 1px;
      height: 40px;
      background: var(--border);
      margin-top: var(--space-sm);
      margin-left: 50%;
      transform: translateX(-50%);
      animation: scrollLine 2s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0%, 100% { opacity: 0.3; height: 40px; }
      50% { opacity: 1; height: 60px; }
    }

    section {
      padding: var(--space-xl) 0;
      border-top: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--space-lg);
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
    }

    .projects-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .project {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: var(--space-md);
      align-items: baseline;
      padding: var(--space-sm) 0;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .project:hover {
      opacity: 0.6;
    }

    .project-index {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      padding-top: 0.3rem;
    }

    .project-content {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .project-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .project-role {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .project-description {
      font-size: 0.9rem;
      color: var(--text-tertiary);
      max-width: 400px;
    }

    .project-year {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      align-self: start;
      padding-top: 0.5rem;
    }

    .writing-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .writing-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .writing-item:hover {
      padding-left: var(--space-sm);
      border-color: var(--text-tertiary);
    }

    .writing-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 400;
      font-style: italic;
    }

    .writing-date {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      flex-shrink: 0;
      margin-left: var(--space-md);
    }

    .contact {
      padding: var(--space-2xl) 0 var(--space-xl);
    }

    .contact-content {
      max-width: 700px;
    }

    .contact-text {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 300;
      line-height: 1.3;
      margin-bottom: var(--space-lg);
    }

    .contact-links {
      display: flex;
      gap: var(--space-lg);
      align-items: center;
    }

    .contact-cta {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      transition: color 0.3s ease;
    }

    .contact-cta:hover {
      color: var(--text);
    }

    .contact-cta::before {
      content: '→';
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.3s ease;
    }

    .contact-cta:hover::before {
      opacity: 1;
      transform: translateX(0);
    }

    footer {
      padding: var(--space-lg) 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .info-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 520px;
      height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: var(--space-xl) var(--space-md);
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      overflow-y: auto;
    }

    .info-panel.open {
      transform: translateX(0);
    }

    .info-close {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.3s ease;
    }

    .info-close:hover {
      color: var(--text);
    }

    .info-content {
      padding-top: var(--space-xl);
    }

    .info-bio {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 300;
      line-height: 1.55;
      margin-bottom: var(--space-md);
    }

    .info-bio:last-of-type {
      margin-bottom: var(--space-md);
    }

    .info-bio a {
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s ease;
    }

    .info-bio a:hover {
      border-color: var(--text);
    }

    .info-aside {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-tertiary);
      line-height: 1.7;
      margin-bottom: var(--space-lg);
      padding-left: var(--space-sm);
      border-left: 2px solid var(--border);
    }

    .info-section {
      margin-bottom: var(--space-md);
    }

    .info-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: var(--space-xs);
    }

    .info-value {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .info-links {
      display: flex;
      gap: var(--space-lg);
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: 1px solid var(--border);
    }

    .info-link {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .info-link:hover {
      color: var(--text);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 28, 28, 0.08);
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s ease;
      z-index: 150;
    }

    .overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Experience Modal */
    .exp-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 28, 28, 0.85);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
    }

    [data-theme="dark"] .exp-modal-overlay {
      background: rgba(10, 10, 9, 0.9);
    }

    .exp-modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .exp-modal {
      background: var(--bg);
      max-width: 560px;
      width: 100%;
      padding: var(--space-xl);
      position: relative;
      transform: translateY(20px) scale(0.98);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .exp-modal-overlay.visible .exp-modal {
      transform: translateY(0) scale(1);
    }

    .exp-modal-close {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.3s ease;
    }

    .exp-modal-close:hover {
      color: var(--text);
    }

    .exp-modal-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .exp-modal-logo {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      flex-shrink: 0;
      color: var(--text);
      padding: 10px;
    }

    .exp-modal-logo svg {
      width: 100%;
      height: 100%;
    }

    .exp-modal-titles {
      flex: 1;
    }

    .exp-modal-company {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: var(--space-xs);
    }

    .exp-modal-role {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .exp-modal-years {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-bottom: var(--space-md);
    }

    .exp-modal-description {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: var(--space-lg);
    }

    .exp-modal-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
    }

    .exp-modal-link:hover {
      color: var(--text);
    }

    .exp-modal-link::after {
      content: '→';
      transition: transform 0.3s ease;
    }

    .exp-modal-link:hover::after {
      transform: translateX(4px);
    }

    @media (max-width: 768px) {
      .exp-modal {
        padding: var(--space-lg) var(--space-md);
      }

      .exp-modal-header {
        flex-direction: column;
        gap: var(--space-sm);
      }
    }

    /* Post styles */
    .post-header {
      margin-bottom: var(--space-xl);
    }

    .post-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: var(--space-sm);
    }

    .post-meta {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
    }

    .post-content {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      line-height: 1.75;
      max-width: 680px;
    }

    .post-content p {
      margin-bottom: var(--space-md);
    }

    .post-content h2 {
      font-family: var(--font-sans);
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: var(--space-lg);
      margin-bottom: var(--space-sm);
      color: var(--text);
    }

    .post-content h3 {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 500;
      margin-top: var(--space-md);
      margin-bottom: var(--space-xs);
    }

    .post-content a {
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s ease;
    }

    .post-content a:hover {
      border-color: var(--text);
    }

    .post-content blockquote {
      font-style: italic;
      padding-left: var(--space-md);
      border-left: 2px solid var(--border);
      margin: var(--space-md) 0;
      color: var(--text-secondary);
    }

    .post-content code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--bg-subtle);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }

    .post-content pre {
      background: var(--bg-subtle);
      padding: var(--space-md);
      border-radius: 4px;
      overflow-x: auto;
      margin: var(--space-md) 0;
    }

    .post-content pre code {
      background: none;
      padding: 0;
    }

    .post-content ul, .post-content ol {
      margin: var(--space-md) 0;
      padding-left: var(--space-md);
    }

    .post-content li {
      margin-bottom: var(--space-xs);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      margin-bottom: var(--space-lg);
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--text);
    }

    @media (max-width: 900px) {
      main {
        padding-left: var(--space-md);
      }

      .hero-intro {
        grid-template-columns: 1fr;
        gap: var(--space-md);
      }

      .scroll-hint {
        display: none;
      }
    }

    @media (max-width: 768px) {
      :root {
        --space-xl: 4rem;
        --space-2xl: 6rem;
      }

      .nav {
        position: relative;
        bottom: auto;
        left: auto;
        margin: var(--space-md);
        margin-bottom: 0;
        margin-right: 140px;
      }

      .top-controls {
        top: var(--space-md);
        right: var(--space-md);
        gap: var(--space-sm);
      }

      .nav.hidden {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .nav-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: var(--space-sm);
      }

      .hero {
        min-height: 70vh;
      }

      .hero-name {
        font-size: clamp(2.5rem, 10vw, 4rem);
      }

      .project {
        grid-template-columns: auto 1fr;
        gap: var(--space-sm);
      }

      .project-year {
        grid-column: 2;
        padding-top: 0;
      }

      .info-panel {
        max-width: 100%;
      }

      main {
        padding: var(--space-md);
        padding-top: var(--space-sm);
      }

      .contact-links {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-sm);
      }
    }

    section[id] {
      scroll-margin-top: var(--space-md);
    }
  </style>
</head>
<body>
  {% include nav.html %}

  <div class="top-controls">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="theme-icon light">Light</span>
      <span class="theme-icon dark">Dark</span>
    </button>
    <button class="info-btn" onclick="toggleInfo()">Info</button>
  </div>

  {% include info-panel.html %}

  <div class="overlay" id="overlay" onclick="toggleInfo()"></div>

  <!-- Experience Modal -->
  <div class="exp-modal-overlay" id="expModalOverlay" onclick="closeExperienceModal(event)">
    <div class="exp-modal" onclick="event.stopPropagation()">
      <button class="exp-modal-close" onclick="closeExperienceModal()">Close</button>
      <div class="exp-modal-header">
        <div class="exp-modal-logo" id="expModalLogo"></div>
        <div class="exp-modal-titles">
          <h2 class="exp-modal-company" id="expModalCompany"></h2>
          <p class="exp-modal-role" id="expModalRole"></p>
        </div>
      </div>
      <p class="exp-modal-years" id="expModalYears"></p>
      <p class="exp-modal-description" id="expModalDescription"></p>
      <a class="exp-modal-link" id="expModalLink" href="" target="_blank">Visit website</a>
    </div>
  </div>

  <main>
    {{ content }}

    <footer>
      <div class="footer-status">
        <span class="status-dot"></span>
        <span>Available for interesting problems</span>
      </div>
      <span>&copy; {{ site.time | date: '%Y' }}</span>
    </footer>
  </main>

  <script>
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      }
    });

    function toggleInfo() {
      const panel = document.getElementById('infoPanel');
      const overlay = document.getElementById('overlay');
      panel.classList.toggle('open');
      overlay.classList.toggle('visible');
      document.body.style.overflow = panel.classList.contains('open') ? 'hidden' : '';
    }

    const nav = document.getElementById('mainNav');
    let ticking = false;

    function updateNav() {
      const currentScroll = window.scrollY;
      const windowHeight = window.innerHeight;
      const docHeight = document.documentElement.scrollHeight;

      if (window.innerWidth > 768) {
        if (currentScroll + windowHeight > docHeight - 300) {
          nav.classList.add('hidden');
        } else {
          nav.classList.remove('hidden');
        }
      }
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateNav);
        ticking = true;
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.project, .writing-item').forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px)';
      el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
      observer.observe(el);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const panel = document.getElementById('infoPanel');
        if (panel.classList.contains('open')) toggleInfo();
        const modal = document.getElementById('expModalOverlay');
        if (modal.classList.contains('visible')) closeExperienceModal();
      }
    });

      homebase: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6zm0 2.5l6 4.5v9h-2v-7H8v7H6v-9l6-4.5z"/></svg>',
      wealthsimple: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 7h3.5l2.5 8.5L11 7h2l3 8.5L18.5 7H22l-5 14h-3l-3-8.5L8 21H5L2 7z"/></svg>',
      shopify: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.34 24l7.22-1.56s-2.6-17.61-2.63-17.73c-.02-.12-.11-.19-.21-.19s-1.93-.14-1.93-.14-1.28-1.27-1.44-1.41a.182.182 0 00-.12-.07l-.91 21.1zm-3.63-12.69s-.81-.42-1.77-.42c-1.45 0-1.5.91-1.5 1.14 0 1.23 3.24 1.71 3.24 4.63 0 2.3-1.44 3.76-3.41 3.76-2.35 0-3.54-1.47-3.54-1.47l.65-2.09s1.24 1.07 2.28 1.07c.67 0 .97-.54.97-.93 0-1.62-2.65-1.69-2.65-4.36-.03-2.24 1.57-4.42 4.83-4.42 1.26 0 1.87.36 1.87.36l-.95 2.72-.02.01zM11.17.83c.14 0 .27.04.41.14-.98.46-2.06 1.64-2.51 3.99l-1.89.58C7.7 3.75 8.95.84 11.17.84v-.01zm1.24 2.95v.14c-.75.23-1.58.48-2.39.73.46-1.78 1.33-2.64 2.08-2.97.19.5.31 1.18.31 2.1zm.54-2.23c.7.07 1.14.87 1.43 1.76l-1.16.37v-.25c0-.75-.1-1.37-.27-1.87v-.01zm2.99 1.29c-.02 0-.06.02-.08.02s-.29.08-.71.21c-.42-1.23-1.18-2.37-2.51-2.37h-.12C12.14.21 11.67 0 11.27 0 8.16 0 6.68 3.88 6.21 5.85c-1.19.36-2.06.64-2.16.67-.67.21-.69.23-.77.87-.08.46-1.83 14.06-1.83 14.06L15.01 24l.93-21.17z"/></svg>',
      blackberry: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.05 3.54L1.17 7.7H4.45C6.97 7.7 7.73 6.47 7.73 5.36 7.73 4.54 7.26 3.54 5.21 3.54H2.05M10.54 3.54L9.66 7.7H12.94C15.5 7.7 16.22 6.47 16.22 5.36 16.22 4.54 15.75 3.54 13.7 3.54H10.54M18.32 7.23L17.39 11.39H20.67C23.24 11.39 24 10.22 24 9.05 24 8.23 23.53 7.23 21.5 7.23H18.32M.88 9.8L0 13.96H3.28C5.85 13.96 6.56 12.73 6.56 11.62 6.56 10.8 6.09 9.8 4.04 9.8H.88M9.43 9.8L8.5 13.96H11.77C14.34 13.96 15.11 12.73 15.11 11.62 15.11 10.8 14.64 9.8 12.59 9.8H9.42M17.09 13.73L16.22 17.88H19.5C22 17.88 22.77 16.71 22.77 15.54 22.77 14.72 22.3 13.73 20.26 13.73H17.09M8.2 16.3L7.32 20.46H10.6C13.11 20.46 13.87 19.23 13.87 18.12 13.87 17.3 13.41 16.3 11.36 16.3H8.2Z"/></svg>'
    };

    function openExperienceModal(company, role, years, description, url, logo) {
      const overlay = document.getElementById('expModalOverlay');
      document.getElementById('expModalCompany').textContent = company;
      document.getElementById('expModalRole').textContent = role;
      document.getElementById('expModalYears').textContent = years;
      document.getElementById('expModalDescription').textContent = description;
      document.getElementById('expModalLink').href = url;
      document.getElementById('expModalLogo').innerHTML = companyLogos[logo] || '';
      overlay.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function closeExperienceModal(event) {
      if (event && event.target !== event.currentTarget) return;
      const overlay = document.getElementById('expModalOverlay');
      overlay.classList.remove('visible');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
